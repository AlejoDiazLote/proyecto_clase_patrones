<div class="checkout-wrapper">
  <div class="checkout-card">
    <!-- Header -->
    <div class="checkout-card__header">
      <button type="button" class="checkout-card__back" (click)="goBack()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
          width="18"
          height="18"
        >
          <path
            fill-rule="evenodd"
            d="M17 10a.75.75 0 0 1-.75.75H5.612l4.158 3.96a.75.75 0 1 1-1.04 1.08l-5.5-5.25a.75.75 0 0 1 0-1.08l5.5-5.25a.75.75 0 1 1 1.04 1.08L5.612 9.25H16.25A.75.75 0 0 1 17 10Z"
            clip-rule="evenodd"
          />
        </svg>
        Volver
      </button>
      <h1 class="checkout-card__title">Completar pago</h1>
      <p class="checkout-card__subtitle">
        Ingresa los datos de tu tarjeta de forma segura
      </p>
    </div>

    <!-- Error -->
    <div *ngIf="errorMessage" class="checkout-card__error" role="alert">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
        width="18"
        height="18"
      >
        <path
          fill-rule="evenodd"
          d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
          clip-rule="evenodd"
        />
      </svg>
      {{ errorMessage }}
    </div>

    <div *ngIf="infoMessage" class="checkout-card__info" role="status">
      <svg
        *ngIf="waitingForWebhook"
        class="checkout-card__spinner"
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
          class="opacity-25"
        />
        <path
          fill="currentColor"
          d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z"
          class="opacity-75"
        />
      </svg>
      <svg
        *ngIf="!waitingForWebhook"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
        width="18"
        height="18"
      >
        <path
          fill-rule="evenodd"
          d="M18 10A8 8 0 1 1 2 10a8 8 0 0 1 16 0Zm-8.75-3.25a.75.75 0 0 0 1.5 0v-.5a.75.75 0 0 0-1.5 0v.5Zm0 2.5a.75.75 0 0 0 0 1.5h.008a.75.75 0 0 0 0-1.5H9.25Z"
          clip-rule="evenodd"
        />
      </svg>
      {{ infoMessage }}
    </div>

    <!-- Loading skeleton -->
    <div *ngIf="loading" class="checkout-card__loading">
      <div class="checkout-card__skeleton"></div>
      <div class="checkout-card__skeleton checkout-card__skeleton--sm"></div>
      <p class="checkout-card__loading-text">
        Preparando formulario de pago...
      </p>
    </div>

    <!-- Stripe Payment Element container -->
    <div [class.checkout-card__hidden]="loading">
      <div id="stripe-payment-element"></div>

      <button
        type="button"
        class="checkout-card__btn-pay"
        (click)="onSubmit()"
        [disabled]="paying || loading || waitingForWebhook || !elementReady"
      >
        <svg
          *ngIf="paying"
          class="checkout-card__spinner"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
            class="opacity-25"
          />
          <path
            fill="currentColor"
            d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z"
            class="opacity-75"
          />
        </svg>
        <svg
          *ngIf="!paying"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
          width="18"
          height="18"
        >
          <path
            fill-rule="evenodd"
            d="M2.5 4A1.5 1.5 0 0 0 1 5.5V6h18v-.5A1.5 1.5 0 0 0 17.5 4h-15ZM19 8.5H1v6A1.5 1.5 0 0 0 2.5 16h15a1.5 1.5 0 0 0 1.5-1.5v-6ZM3 13.25a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5h-1.5a.75.75 0 0 1-.75-.75Zm4.75-.75a.75.75 0 0 0 0 1.5h3.5a.75.75 0 0 0 0-1.5h-3.5Z"
            clip-rule="evenodd"
          />
        </svg>
        {{
          paying
            ? "Procesando..."
            : !elementReady
              ? "Cargando formulario..."
              : "Pagar ahora"
        }}
      </button>

      <p class="checkout-card__secure-note">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
          width="14"
          height="14"
        >
          <path
            fill-rule="evenodd"
            d="M10 1a4.5 4.5 0 0 0-4.5 4.5V9H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-.5V5.5A4.5 4.5 0 0 0 10 1Zm3 8V5.5a3 3 0 1 0-6 0V9h6Z"
            clip-rule="evenodd"
          />
        </svg>
        Pago seguro procesado por Stripe
      </p>
    </div>
  </div>
</div>

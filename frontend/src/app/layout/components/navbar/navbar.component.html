<nav class="navbar">
  <div class="navbar__brand">
    <a routerLink="/events" class="navbar__brand-link">
      <div class="navbar__logo">
        <svg
          width="28"
          height="28"
          viewBox="0 0 28 28"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M14 2L3 7v7c0 6.08 4.72 11.76 11 13 6.28-1.24 11-6.92 11-13V7L14 2z"
            fill="#FFB81C"
          />
          <path
            d="M14 6L6 10v5c0 4.28 3.32 8.28 8 9.36 4.68-.08 8-4.08 8-9.36v-5L14 6z"
            fill="#002D72"
          />
          <path
            d="M10 14l3 3 5-5"
            stroke="#FFB81C"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="navbar__brand-text">
        <span class="navbar__brand-title">Eventos Académicos</span>
        <span class="navbar__brand-sub">Pontificia Universidad Javeriana</span>
      </div>
    </a>
  </div>

  <div class="navbar__links">
    <a
      routerLink="/events"
      routerLinkActive="navbar__link--active"
      class="navbar__link"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      Catálogo
    </a>

    <ng-container *ngIf="currentUser$ | async as navUser">
      <a
        routerLink="/mis-inscripciones"
        routerLinkActive="navbar__link--active"
        class="navbar__link"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
        Mis inscripciones
      </a>
      <a
        routerLink="/mis-certificados"
        routerLinkActive="navbar__link--active"
        class="navbar__link"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            fill-rule="evenodd"
            d="M5.166 2.621v.858c-1.035.148-2.059.33-3.071.543a.75.75 0 0 0-.584.859 6.753 6.753 0 0 0 6.138 5.6 6.73 6.73 0 0 0 2.743 1.346A6.707 6.707 0 0 1 9.279 15H8.54c-1.036 0-1.875.84-1.875 1.875V19.5h-.75a2.25 2.25 0 0 0-2.25 2.25c0 .414.336.75.75.75h15a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-2.25-2.25h-.75v-2.625c0-1.036-.84-1.875-1.875-1.875h-.739a6.706 6.706 0 0 1-1.112-3.173 6.73 6.73 0 0 0 2.743-1.347 6.753 6.753 0 0 0 6.139-5.6.75.75 0 0 0-.585-.858 47.077 47.077 0 0 0-3.07-.543V2.62a.75.75 0 0 0-.658-.744 49.22 49.22 0 0 0-6.093-.377c-2.063 0-4.096.128-6.093.377a.75.75 0 0 0-.657.744Zm0 2.629c0 1.196.312 2.32.857 3.294A5.266 5.266 0 0 1 3.16 5.337a45.6 45.6 0 0 1 2.006-.343v.256Zm13.5 0v-.256c.674.1 1.343.214 2.006.343a5.265 5.265 0 0 1-2.863 3.207 6.72 6.72 0 0 0 .857-3.294Z"
            clip-rule="evenodd"
          />
        </svg>
        Mis certificados
      </a>
      <a
        *ngIf="navUser.rol === 'ADMIN' || navUser.rol === 'ORGANIZADOR'"
        routerLink="/events/admin"
        routerLinkActive="navbar__link--active"
        class="navbar__link"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
        </svg>
        Gestión de eventos
      </a>
      <a
        *ngIf="navUser.rol === 'ADMIN' || navUser.rol === 'ORGANIZADOR'"
        routerLink="/organizer"
        routerLinkActive="navbar__link--active"
        class="navbar__link"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
          <line x1="8" y1="21" x2="16" y2="21" />
          <line x1="12" y1="17" x2="12" y2="21" />
        </svg>
        Panel organizador
      </a>
    </ng-container>

    <div class="navbar__divider"></div>

    <ng-container *ngIf="currentUser$ | async as user; else guestTpl">
      <div class="navbar__user-info">
        <div class="navbar__avatar">
          {{ user.nombre.charAt(0).toUpperCase() }}
        </div>
        <span class="navbar__user-name">{{ user.nombre }}</span>
      </div>
      <button class="navbar__btn navbar__btn--logout" (click)="logout()">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Cerrar sesión
      </button>
    </ng-container>

    <ng-template #guestTpl>
      <a routerLink="/auth/login" class="navbar__btn navbar__btn--primary">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" y1="12" x2="3" y2="12" />
        </svg>
        Iniciar sesión
      </a>
    </ng-template>
  </div>
</nav>
